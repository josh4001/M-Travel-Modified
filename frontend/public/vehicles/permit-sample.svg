<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="perBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8f5"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581845"/>
      <stop offset="100%" stop-color="#300d26"/>
    </linearGradient>
    <filter id="perShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Border & Background -->
  <rect x="20" y="20" width="760" height="1060" rx="16" fill="url(#perBg)" stroke="#581845" stroke-width="3" filter="url(#perShadow)"/>
  <rect x="36" y="36" width="728" height="1028" rx="10" fill="none" stroke="#c0a9bd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Watermark -->
  <g opacity="0.04" transform="translate(400, 560) rotate(-30)">
    <text font-family="Arial, sans-serif" font-size="85" font-weight="900" text-anchor="middle" fill="#000">FLEET HOST PERMIT</text>
    <text y="85" font-family="Arial, sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#000">TRA ACCREDITED</text>
  </g>

  <!-- Header -->
  <rect x="50" y="55" width="700" height="115" rx="8" fill="url(#burgundyGrad)"/>
  <circle cx="110" cy="112" r="38" fill="#d4af37"/>
  <text x="110" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#300d26">📜</text>

  <text x="410" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle" fill="#d4af37">TOURISM REGULATORY AUTHORITY (TRA) &amp; NTSA</text>
  <text x="410" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#ffffff">FLEET HOST OPERATING ACCREDITATION &amp; PSV PERMIT</text>
  <text x="410" y="139" font-family="Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="1" text-anchor="middle" fill="#e8d7e6">OFFICIAL AUTHORIZATION FOR PRIVATE HIRE &amp; SAFARI FLEET OPERATIONS</text>

  <!-- Permit License Bar -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="330" height="42" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
    <text x="15" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#831843">Permit No: <tspan font-family="monospace">TRA-HOST-2024-99120</tspan></text>

    <rect x="350" y="0" width="330" height="42" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
    <text x="365" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#831843">Host ID Ref: <tspan font-family="monospace">KENYA-ID-29841029</tspan></text>
  </g>

  <!-- Section 1: Host Particulars -->
  <g transform="translate(60, 260)">
    <rect x="0" y="0" width="680" height="28" fill="#581845" rx="4"/>
    <text x="15" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#fff">SECTION 1: ACCREDITED HOST &amp; OPERATOR PROFILE</text>

    <rect x="0" y="36" width="680" height="220" fill="#fff" stroke="#dcd6c8" rx="4"/>
    <line x1="0" y1="76" x2="680" y2="76" stroke="#f0f0f0"/>
    <line x1="0" y1="116" x2="680" y2="116" stroke="#f0f0f0"/>
    <line x1="0" y1="156" x2="680" y2="156" stroke="#f0f0f0"/>
    <line x1="0" y1="196" x2="680" y2="196" stroke="#f0f0f0"/>
    <line x1="340" y1="36" x2="340" y2="256" stroke="#f0f0f0"/>

    <g font-family="Arial, sans-serif" font-size="11">
      <text x="15" y="58" fill="#666">Full Legal Name:</text>
      <text x="140" y="58" font-weight="bold" fill="#000">HARRY NJOROGE</text>

      <text x="15" y="98" fill="#666">National Identity No:</text>
      <text x="140" y="98" font-weight="bold" font-family="monospace" fill="#000">29841029 (Verified Republic of Kenya)</text>

      <text x="15" y="138" fill="#666">KRA Tax PIN:</text>
      <text x="140" y="138" font-weight="bold" font-family="monospace" fill="#000">A009281729B (Tax Compliance Valid)</text>

      <text x="15" y="178" fill="#666">Designated Hub Base:</text>
      <text x="140" y="178" font-weight="bold" fill="#000">Nairobi Central Fleet Hub &amp; JKIA</text>

      <text x="15" y="218" fill="#666">Operation Category:</text>
      <text x="140" y="218" font-weight="bold" fill="#581845">TOURIST CLASS A CHAUFFEUR &amp; PSV</text>
    </g>

    <g font-family="Arial, sans-serif" font-size="11" transform="translate(340, 0)">
      <text x="15" y="58" fill="#666">Accreditation Date:</text>
      <text x="150" y="58" font-weight="bold" fill="#000">10th January 2024</text>

      <text x="15" y="98" fill="#666">Permit Expiry Date:</text>
      <text x="150" y="98" font-weight="bold" fill="#1b873f">31st December 2026</text>

      <text x="15" y="138" fill="#666">Registered Vehicles:</text>
      <text x="150" y="138" font-weight="bold" fill="#000">KDG 900B, KDH 900B (West Coach)</text>

      <text x="15" y="178" fill="#666">Background Check:</text>
      <text x="150" y="178" font-weight="bold" fill="#1b873f">PASSED (Clean Criminal &amp; DCI Record)</text>

      <text x="15" y="218" fill="#666">Host Tier Status:</text>
      <text x="150" y="218" font-weight="bold" fill="#d4af37">PREMIUM LUXURY HOST</text>
    </g>
  </g>

  <!-- Section 2: Host Responsibilities & Standards -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="680" height="28" fill="#581845" rx="4"/>
    <text x="15" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#fff">SECTION 2: STATUTORY COVENANTS &amp; FLEET SAFETY COMMITMENTS</text>

    <rect x="0" y="36" width="680" height="170" fill="#fff" stroke="#dcd6c8" rx="4"/>
    <g font-family="Arial, sans-serif" font-size="11">
      <text x="15" y="65" font-weight="bold" fill="#300d26">1. Passenger Safety &amp; Comfort Standards:</text>
      <text x="15" y="82" fill="#555">The host guarantees that all vehicles deployed under this license undergo comprehensive 42-point pre-trip inspections, professional sanitation, and certified mechanical servicing.</text>

      <text x="15" y="112" font-weight="bold" fill="#300d26">2. Professional Chauffeur Conduct:</text>
      <text x="15" y="129" fill="#555">All appointed drivers possess valid NTSA commercial endorsements, extensive cross-country tourist experience, and full background accreditation.</text>

      <text x="15" y="160" font-weight="bold" fill="#1b873f">✓ Fully integrated with M-Travel automated escrow &amp; host compensation system.</text>
    </g>
  </g>

  <!-- Section 3: Official Endorsement & Stamp -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="680" height="210" fill="#fdf8fa" stroke="#c0a9bd" rx="8"/>

    <!-- Seal -->
    <g transform="translate(130, 105)">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#581845" stroke-width="2" stroke-dasharray="5,2"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#581845" stroke-width="1.5"/>
      <text x="0" y="-35" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#581845">TOURISM REGULATORY AUTHORITY</text>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#581845">ACCREDITED</text>
      <text x="0" y="14" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#581845">★ HOST PERMIT ★</text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#581845">NAIROBI HQ</text>
    </g>

    <!-- Signatures -->
    <g transform="translate(250, 45)" font-family="Arial, sans-serif">
      <path d="M 10 30 Q 30 10 60 28 T 120 18 T 170 30" fill="none" stroke="#300d26" stroke-width="2"/>
      <line x1="0" y1="42" x2="200" y2="42" stroke="#aaa" stroke-width="1"/>
      <text x="0" y="58" font-size="10" font-weight="bold" fill="#000">Director of Licensing &amp; Compliance</text>
      <text x="0" y="73" font-size="9" fill="#666">Tourism Regulatory Authority (TRA)</text>

      <path d="M 10 110 Q 40 90 80 110 T 140 100 T 180 112" fill="none" stroke="#300d26" stroke-width="2"/>
      <line x1="0" y1="122" x2="200" y2="122" stroke="#aaa" stroke-width="1"/>
      <text x="0" y="138" font-size="10" font-weight="bold" fill="#000">Chief Registrar of PSV Operators</text>
      <text x="0" y="153" font-size="9" fill="#1b873f" font-weight="bold">Token: TRA-2024-PSV-HOST-AUTH</text>
    </g>

    <!-- Barcode / QR -->
    <g transform="translate(540, 35)">
      <rect x="0" y="0" width="100" height="100" fill="#fff" stroke="#581845" stroke-width="2" rx="4"/>
      <rect x="10" y="10" width="25" height="25" fill="#581845"/>
      <rect x="15" y="15" width="15" height="15" fill="#fff"/>
      <rect x="65" y="10" width="25" height="25" fill="#581845"/>
      <rect x="70" y="15" width="15" height="15" fill="#fff"/>
      <rect x="10" y="65" width="25" height="25" fill="#581845"/>
      <rect x="15" y="70" width="15" height="15" fill="#fff"/>
      <rect x="42" y="42" width="16" height="16" fill="#581845"/>
      <rect x="42" y="15" width="10" height="15" fill="#581845"/>
      <rect x="70" y="55" width="15" height="10" fill="#581845"/>
      <rect x="65" y="75" width="20" height="15" fill="#581845"/>
      <text x="50" y="115" font-family="monospace" font-size="8" text-anchor="middle" fill="#581845">HOST VERIFIED</text>
      <text x="50" y="125" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">TRA Official Registry</text>
    </g>
  </g>

  <!-- Footer Disclaimer -->
  <text x="400" y="1035" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888">
    This permit is issued under Section 11 of the Tourism Act. Holders must present this document upon lawful inspection.
  </text>
</svg>
