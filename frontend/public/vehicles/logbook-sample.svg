<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcfbfa"/>
      <stop offset="100%" stop-color="#f4efe6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Paper -->
  <rect x="20" y="20" width="760" height="1060" rx="16" fill="url(#bg)" stroke="#c5b288" stroke-width="3" filter="url(#shadow)"/>
  <rect x="36" y="36" width="728" height="1028" rx="10" fill="none" stroke="#e0d6c3" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Watermark -->
  <g opacity="0.04" transform="translate(400, 550) rotate(-30)">
    <text font-family="Arial, sans-serif" font-size="90" font-weight="900" text-anchor="middle" fill="#000">REPUBLIC OF KENYA</text>
    <text y="90" font-family="Arial, sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#000">NTSA VERIFIED</text>
  </g>

  <!-- Header Banner -->
  <rect x="50" y="55" width="700" height="110" rx="8" fill="#0c231e"/>
  <circle cx="110" cy="110" r="38" fill="url(#gold)"/>
  <text x="110" y="117" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#0c231e">★</text>

  <text x="410" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#d4af37">REPUBLIC OF KENYA</text>
  <text x="410" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#ffffff">NATIONAL TRANSPORT AND SAFETY AUTHORITY (NTSA)</text>
  <text x="410" y="138" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle" fill="#a3b899">TIMS MOTOR VEHICLE REGISTRATION SYSTEM</text>

  <!-- Document Title -->
  <rect x="180" y="185" width="440" height="38" rx="6" fill="#f0ebd8" stroke="#d4af37" stroke-width="1.5"/>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#0c231e">CERTIFICATE OF VEHICLE REGISTRATION</text>

  <!-- Metadata Bar -->
  <g transform="translate(60, 245)" font-family="Arial, sans-serif" font-size="11">
    <text x="0" y="0" fill="#666">Serial No: <tspan font-weight="bold" fill="#000" font-family="monospace">NTSA-LOG-2024-8849102</tspan></text>
    <text x="440" y="0" fill="#666">Issuance Date: <tspan font-weight="bold" fill="#000">12th January 2024</tspan></text>
    <line x1="0" y1="12" x2="680" y2="12" stroke="#d4af37" stroke-width="1"/>
  </g>

  <!-- Section 1: Vehicle Particulars -->
  <g transform="translate(60, 285)">
    <rect x="0" y="0" width="680" height="28" fill="#1b3b33" rx="4"/>
    <text x="15" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#fff">SECTION A: VEHICLE IDENTIFICATION &amp; TECHNICAL PARTICULARS</text>

    <!-- Table Grid -->
    <rect x="0" y="36" width="680" height="250" fill="#fff" stroke="#dcd6c8" rx="4"/>
    
    <!-- Table Rows -->
    <line x1="0" y1="78" x2="680" y2="78" stroke="#eee"/>
    <line x1="0" y1="120" x2="680" y2="120" stroke="#eee"/>
    <line x1="0" y1="162" x2="680" y2="162" stroke="#eee"/>
    <line x1="0" y1="204" x2="680" y2="204" stroke="#eee"/>
    <line x1="0" y1="246" x2="680" y2="246" stroke="#eee"/>
    <line x1="340" y1="36" x2="340" y2="286" stroke="#eee"/>

    <!-- Left Column Fields -->
    <g font-family="Arial, sans-serif" font-size="11">
      <text x="15" y="58" fill="#777">Registration Mark:</text>
      <text x="150" y="58" font-weight="bold" font-size="14" fill="#0c231e" font-family="monospace">KDG 900B / KDH 900B</text>

      <text x="15" y="100" fill="#777">Make &amp; Model:</text>
      <text x="150" y="100" font-weight="bold" fill="#000">ISUZU WEST COACH / LUXURY FLEET</text>

      <text x="15" y="142" fill="#777">Year of Manufacture:</text>
      <text x="150" y="142" font-weight="bold" fill="#000">2023 / 2024</text>

      <text x="15" y="184" fill="#777">Engine Number:</text>
      <text x="150" y="184" font-weight="bold" fill="#000" font-family="monospace">4HK1-TCX-882910</text>

      <text x="15" y="226" fill="#777">Chassis / VIN:</text>
      <text x="150" y="226" font-weight="bold" fill="#000" font-family="monospace">JALN75-99201488102</text>

      <text x="15" y="268" fill="#777">Body Type:</text>
      <text x="150" y="268" font-weight="bold" fill="#000">TOURIST COACH / PSV BUS</text>
    </g>

    <!-- Right Column Fields -->
    <g font-family="Arial, sans-serif" font-size="11" transform="translate(340, 0)">
      <text x="15" y="58" fill="#777">Seating Capacity:</text>
      <text x="160" y="58" font-weight="bold" fill="#000">33 Passengers (Luxury)</text>

      <text x="15" y="100" fill="#777">Engine Rating (CC):</text>
      <text x="160" y="100" font-weight="bold" fill="#000">5,193 CC (Turbo Diesel)</text>

      <text x="15" y="142" fill="#777">Fuel Type:</text>
      <text x="160" y="142" font-weight="bold" fill="#000">DIESEL (Euro 4 Standard)</text>

      <text x="15" y="184" fill="#777">Tare Weight (kg):</text>
      <text x="160" y="184" font-weight="bold" fill="#000">4,850 KG</text>

      <text x="15" y="226" fill="#777">Color / Livery:</text>
      <text x="160" y="226" font-weight="bold" fill="#000">White / Safari Pearl</text>

      <text x="15" y="268" fill="#777">Duty / Tax Status:</text>
      <text x="160" y="268" font-weight="bold" fill="#1b873f">DUTY FULLY PAID</text>
    </g>
  </g>

  <!-- Section 2: Registered Owner -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="680" height="28" fill="#1b3b33" rx="4"/>
    <text x="15" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#fff">SECTION B: REGISTERED PROPRIETOR / OWNER DETAILS</text>

    <rect x="0" y="36" width="680" height="150" fill="#fff" stroke="#dcd6c8" rx="4"/>
    
    <g font-family="Arial, sans-serif" font-size="11">
      <text x="15" y="65" fill="#777">Proprietor Name:</text>
      <text x="160" y="65" font-weight="bold" font-size="13" fill="#000">HARRY NJOROGE / M-TRAVEL FLEET PARTNER</text>

      <text x="15" y="95" fill="#777">National ID / PIN:</text>
      <text x="160" y="95" font-weight="bold" fill="#000" font-family="monospace">ID: 29841029 / KRA PIN: A009281729B</text>

      <text x="15" y="125" fill="#777">Postal Address:</text>
      <text x="160" y="125" font-weight="bold" fill="#000">P.O. BOX 48201 - 00100, NAIROBI, KENYA</text>

      <text x="15" y="155" fill="#777">Platform Accreditation:</text>
      <text x="160" y="155" font-weight="bold" fill="#1b873f">M-TRAVEL ACCREDITED FLEET HOST (VERIFIED)</text>
    </g>
  </g>

  <!-- Section 3: Official Verification & Security Features -->
  <g transform="translate(60, 810)">
    <rect x="0" y="0" width="680" height="190" fill="#fdfbf7" stroke="#c5b288" rx="8"/>

    <!-- Barcode representation -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="180" height="40" fill="#000"/>
      <line x1="6" y1="0" x2="6" y2="40" stroke="#fff" stroke-width="3"/>
      <line x1="16" y1="0" x2="16" y2="40" stroke="#fff" stroke-width="2"/>
      <line x1="26" y1="0" x2="26" y2="40" stroke="#fff" stroke-width="5"/>
      <line x1="42" y1="0" x2="42" y2="40" stroke="#fff" stroke-width="1"/>
      <line x1="56" y1="0" x2="56" y2="40" stroke="#fff" stroke-width="4"/>
      <line x1="72" y1="0" x2="72" y2="40" stroke="#fff" stroke-width="3"/>
      <line x1="90" y1="0" x2="90" y2="40" stroke="#fff" stroke-width="6"/>
      <line x1="110" y1="0" x2="110" y2="40" stroke="#fff" stroke-width="2"/>
      <line x1="126" y1="0" x2="126" y2="40" stroke="#fff" stroke-width="5"/>
      <line x1="148" y1="0" x2="148" y2="40" stroke="#fff" stroke-width="3"/>
      <line x1="166" y1="0" x2="166" y2="40" stroke="#fff" stroke-width="4"/>
      <text x="90" y="55" font-family="monospace" font-size="9" text-anchor="middle" fill="#555">*NTSA-REG-KDG900B*</text>
    </g>

    <!-- Official Stamp Circle -->
    <g transform="translate(560, 80)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#aa2b2b" stroke-width="2" stroke-dasharray="6,2"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#aa2b2b" stroke-width="1.5"/>
      <text x="0" y="-30" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#aa2b2b">REGISTRAR OF MOTOR VEHICLES</text>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#aa2b2b">NTSA KENYA</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#aa2b2b">★ VERIFIED ★</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#aa2b2b">NAIROBI HEADQUARTERS</text>
    </g>

    <!-- Signature Block -->
    <g transform="translate(260, 45)" font-family="Arial, sans-serif">
      <path d="M 10 40 Q 40 10 70 35 T 130 25 T 180 38" fill="none" stroke="#1d3557" stroke-width="2"/>
      <line x1="0" y1="50" x2="220" y2="50" stroke="#999" stroke-width="1"/>
      <text x="0" y="65" font-size="10" font-weight="bold" fill="#000">For: REGISTRAR OF MOTOR VEHICLES</text>
      <text x="0" y="80" font-size="9" fill="#666">TIMS Electronic Certification Authority</text>
      <text x="0" y="95" font-size="9" fill="#1b873f" font-weight="bold">✓ Authentic Government Digital Certificate</text>
    </g>
  </g>

  <!-- Footer Disclaimer -->
  <text x="400" y="1035" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888">
    This document is an electronic certified extract generated from the NTSA Transport Integrated Management System (TIMS).
  </text>
</svg>
