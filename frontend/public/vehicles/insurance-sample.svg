<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="insBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7f4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132"/>
      <stop offset="100%" stop-color="#083320"/>
    </linearGradient>
    <filter id="insShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Border & Background -->
  <rect x="20" y="20" width="760" height="1060" rx="16" fill="url(#insBg)" stroke="#198754" stroke-width="3" filter="url(#insShadow)"/>
  <rect x="36" y="36" width="728" height="1028" rx="10" fill="none" stroke="#badbcc" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Watermark -->
  <g opacity="0.04" transform="translate(400, 560) rotate(-35)">
    <text font-family="Arial, sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#000">COMMERCIAL PSV</text>
    <text y="80" font-family="Arial, sans-serif" font-size="70" font-weight="900" text-anchor="middle" fill="#000">COMPREHENSIVE COVER</text>
  </g>

  <!-- Header -->
  <rect x="50" y="55" width="700" height="115" rx="8" fill="url(#emeraldGrad)"/>
  <circle cx="110" cy="112" r="38" fill="#ffc107"/>
  <text x="110" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#083320">🛡️</text>

  <text x="410" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" text-anchor="middle" fill="#ffc107">KENYA ORIENT / JUBILEE ALLIANZ PSV MOTOR</text>
  <text x="410" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#ffffff">COMMERCIAL PSV INSURANCE CERTIFICATE</text>
  <text x="410" y="139" font-family="Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="1" text-anchor="middle" fill="#d1e7dd">ISSUED IN ACCORDANCE WITH THE INSURANCE (MOTOR VEHICLES THIRD PARTY RISKS) ACT</text>

  <!-- Policy Header Badges -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="330" height="42" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
    <text x="15" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Policy Ref: <tspan font-family="monospace">PSV-EXP-99482-KE</tspan></text>

    <rect x="350" y="0" width="330" height="42" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
    <text x="365" y="26" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Cert No: <tspan font-family="monospace">AKI-CERT-2024-44109</tspan></text>
  </g>

  <!-- Section 1: Policy Schedule -->
  <g transform="translate(60, 260)">
    <rect x="0" y="0" width="680" height="28" fill="#0f5132" rx="4"/>
    <text x="15" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#fff">SCHEDULE OF COVERAGE &amp; INSURED PARTICULARS</text>

    <rect x="0" y="36" width="680" height="240" fill="#fff" stroke="#c3e6cb" rx="4"/>
    <line x1="0" y1="76" x2="680" y2="76" stroke="#f0f0f0"/>
    <line x1="0" y1="116" x2="680" y2="116" stroke="#f0f0f0"/>
    <line x1="0" y1="156" x2="680" y2="156" stroke="#f0f0f0"/>
    <line x1="0" y1="196" x2="680" y2="196" stroke="#f0f0f0"/>
    <line x1="340" y1="36" x2="340" y2="276" stroke="#e8f5e9"/>

    <g font-family="Arial, sans-serif" font-size="11">
      <text x="15" y="58" fill="#666">Insured Name:</text>
      <text x="140" y="58" font-weight="bold" fill="#000">HARRY NJOROGE / M-TRAVEL</text>

      <text x="15" y="98" fill="#666">Registration Mark:</text>
      <text x="140" y="98" font-weight="bold" font-size="13" font-family="monospace" fill="#0f5132">KDG 900B / KDH 900B</text>

      <text x="15" y="138" fill="#666">Make &amp; Model:</text>
      <text x="140" y="138" font-weight="bold" fill="#000">ISUZU WEST COACH (33 SEATS)</text>

      <text x="15" y="178" fill="#666">Coverage Type:</text>
      <text x="140" y="178" font-weight="bold" fill="#0f5132">COMPREHENSIVE COMMERCIAL PSV</text>

      <text x="15" y="218" fill="#666">Limitations of Use:</text>
      <text x="140" y="218" font-weight="bold" fill="#000">Tourist Hire, Safari &amp; VIP Chauffeur</text>

      <text x="15" y="258" fill="#666">Geographical Area:</text>
      <text x="140" y="258" font-weight="bold" fill="#000">Kenya, Uganda, Tanzania &amp; Rwanda</text>
    </g>

    <g font-family="Arial, sans-serif" font-size="11" transform="translate(340, 0)">
      <text x="15" y="58" fill="#666">Policy Start Date:</text>
      <text x="150" y="58" font-weight="bold" fill="#000">01 January 2024 (00:01 hrs)</text>

      <text x="15" y="98" fill="#666">Policy Expiry Date:</text>
      <text x="150" y="98" font-weight="bold" fill="#0f5132">31 December 2025 (23:59 hrs)</text>

      <text x="15" y="138" fill="#666">Passenger Legal Liab:</text>
      <text x="150" y="138" font-weight="bold" fill="#000">KES 100,000,000 / occurrence</text>

      <text x="15" y="178" fill="#666">Third Party Property:</text>
      <text x="150" y="178" font-weight="bold" fill="#000">KES 50,000,000 / occurrence</text>

      <text x="15" y="218" fill="#666">Excess / Deductible:</text>
      <text x="150" y="218" font-weight="bold" fill="#000">KES 0 (Nil Excess Package)</text>

      <text x="15" y="258" fill="#666">Status of Policy:</text>
      <text x="150" y="258" font-weight="bold" fill="#1b873f">ACTIVE &amp; IN FORCE (VERIFIED)</text>
    </g>
  </g>

  <!-- Section 2: Legal PSV Endorsement -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="680" height="28" fill="#0f5132" rx="4"/>
    <text x="15" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#fff">SPECIAL TOURIST PSV ENDORSEMENTS &amp; ACCREDITATIONS</text>

    <rect x="0" y="36" width="680" height="150" fill="#fff" stroke="#c3e6cb" rx="4"/>
    <g font-family="Arial, sans-serif" font-size="11">
      <text x="15" y="65" font-weight="bold" fill="#083320">Clause 12A - Tourist Hire &amp; Overland Safaris:</text>
      <text x="15" y="82" fill="#555">This vehicle is fully insured for commercial chauffeur drive, national park game reserves, and inter-county luxury passenger travel.</text>

      <text x="15" y="112" font-weight="bold" fill="#083320">Clause 14B - Platform Liability Interlocking:</text>
      <text x="15" y="129" fill="#555">Underwritten in joint covenant with M-Travel Kenya Limited for seamless digital claim settlements and passenger safety assurance.</text>

      <text x="15" y="160" font-weight="bold" fill="#1b873f">✓ Certificate validated on the Association of Kenya Insurers (AKI) digital database.</text>
    </g>
  </g>

  <!-- Section 3: Digital Seals & QR Verification -->
  <g transform="translate(60, 770)">
    <rect x="0" y="0" width="680" height="210" fill="#f8fcf9" stroke="#81c784" rx="8"/>

    <!-- Seal -->
    <g transform="translate(130, 105)">
      <circle cx="0" cy="0" r="60" fill="none" stroke="#0f5132" stroke-width="2" stroke-dasharray="5,2"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#0f5132" stroke-width="1.5"/>
      <text x="0" y="-35" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#0f5132">UNDERWRITING SEAL</text>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f5132">KENYA ORIENT</text>
      <text x="0" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f5132">★ PSV VALIDATED ★</text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#0f5132">AUTHORIZED ISSUANCE</text>
    </g>

    <!-- Signatures and Details -->
    <g transform="translate(250, 45)" font-family="Arial, sans-serif">
      <path d="M 10 30 Q 30 5 60 25 T 120 15 T 170 30" fill="none" stroke="#083320" stroke-width="2"/>
      <line x1="0" y1="42" x2="200" y2="42" stroke="#aaa" stroke-width="1"/>
      <text x="0" y="58" font-size="10" font-weight="bold" fill="#000">Managing Director / Underwriting Principal</text>
      <text x="0" y="73" font-size="9" fill="#666">Association of Kenya Insurers (AKI) Member</text>

      <path d="M 10 110 Q 40 85 80 105 T 140 95 T 180 110" fill="none" stroke="#083320" stroke-width="2"/>
      <line x1="0" y1="122" x2="200" y2="122" stroke="#aaa" stroke-width="1"/>
      <text x="0" y="138" font-size="10" font-weight="bold" fill="#000">Authorized Agency Officer</text>
      <text x="0" y="153" font-size="9" fill="#1b873f" font-weight="bold">Digital Verification Token: 0x88F92A0B71</text>
    </g>

    <!-- QR Code Block -->
    <g transform="translate(540, 35)">
      <rect x="0" y="0" width="100" height="100" fill="#fff" stroke="#0f5132" stroke-width="2" rx="4"/>
      <!-- Pseudo QR pattern -->
      <rect x="10" y="10" width="25" height="25" fill="#0f5132"/>
      <rect x="15" y="15" width="15" height="15" fill="#fff"/>
      <rect x="65" y="10" width="25" height="25" fill="#0f5132"/>
      <rect x="70" y="15" width="15" height="15" fill="#fff"/>
      <rect x="10" y="65" width="25" height="25" fill="#0f5132"/>
      <rect x="15" y="70" width="15" height="15" fill="#fff"/>
      <rect x="42" y="42" width="16" height="16" fill="#0f5132"/>
      <rect x="42" y="15" width="10" height="15" fill="#0f5132"/>
      <rect x="70" y="55" width="15" height="10" fill="#0f5132"/>
      <rect x="65" y="75" width="20" height="15" fill="#0f5132"/>
      <text x="50" y="115" font-family="monospace" font-size="8" text-anchor="middle" fill="#0f5132">SCAN TO VERIFY</text>
      <text x="50" y="125" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">AKI Insurance DB</text>
    </g>
  </g>

  <!-- Footer Disclaimer -->
  <text x="400" y="1035" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888">
    This policy certificate is issued pursuant to the laws of Kenya. Verification hotline: +254 20 2750000 / AKI Portal.
  </text>
</svg>
